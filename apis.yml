aid: amplify
name: Amplify
description: 'Amplify (Amplify Life Insurance) is an insurtech founded in 2019 and
  launched in 2020, building what it calls the modern infrastructure for life insurance.
  It sells term, permanent, indexed universal life (IUL), annuity, final expense whole
  life and accidental death benefit products, with an emphasis on cash-value policies
  customers can borrow against while alive. Amplify distributes through four motions
  on one platform: a direct-to-consumer digital experience, an advisor and referral
  network, embedded distribution inside partner products, and white-label carrier
  partnerships with carriers and reinsurers including FGL, EMC and Munich Re. Its
  public developer surface is minimal: there is no developer portal, no published
  OpenAPI and no public SDKs. The company does operate a production API host (api.getamplifylife.com)
  fronted by AWS API Gateway that rejects unauthenticated calls, and it publishes
  embeddable IUL/VUL calculator widgets under /embed/ used for partner and advisor
  placements.'
